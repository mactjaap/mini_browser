<!doctype html>
<html><head><meta charset="utf-8"><title>Phase 2 Nested Formatting</title></head><body>
<h1>Nested Formatting</h1>
<p>plain <b>bold <i>bold italic</i> bold again</b> plain again</p>
<p><strong>strong <code>code inside strong</code></strong></p>
<blockquote>quote <em>emphasis</em> end quote</blockquote>
<ul><li>one</li><li><b>two</b></li></ul>
<ol><li>first</li><li><i>second</i></li></ol>
<p>END NESTED FORMATTING</p>
</body></html>
