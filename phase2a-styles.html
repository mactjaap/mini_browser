<!doctype html>
<html>
<head><meta charset="utf-8"><title>Phase 2A Inline Text Styles</title></head>
<body>
<p>PHASE2A STYLES</p>
<p style="font-weight:bold">bold</p>
<p style="font-weight:700">weight 700</p>
<p style="font-style:italic">italic</p>
<p style="text-decoration:underline">underline</p>
<p style="text-align:left">left aligned</p>
<p style="text-align:center">center aligned</p>
<p style="text-align:right">right aligned</p>
<p style="color:yellow;font-weight:bold">yellow bold</p>
<div style="font-weight:bold">parent bold <span style="font-style:italic">bold italic</span> restored bold</div>
<div style="font-weight:bold">bold <span style="font-weight:normal">normal</span> bold again</div>
<div style="text-decoration:underline">underlined <span style="text-decoration:none">not underlined</span> underlined again</div>
<p style="font-style:normal">explicit normal italic</p>
<p style="font-weight:nonsense;font-style:sideways;text-decoration:blink;text-align:justify">invalid ignored</p>
<p>END PHASE2A STYLES</p>
</body>
</html>
