<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 2B Background Colors</title>
</head>
<body>
<p>PHASE2B BACKGROUNDS</p>

<span style="background-color:yellow">yellow background</span><br>
<span style="background-color:#036; color:white">short hex background</span><br>
<p style="background-color:#003366; color:white">dark blue paragraph text run</p>

<div style="background-color:purple; color:white">
purple parent <span style="background-color:orange; color:black">orange child</span> restored purple
</div>

<div style="background-color:gray; color:white">
gray parent <span style="background-color:transparent; color:yellow">transparent child</span> restored gray
</div>

<p><span style="color:white; background-color:blue; font-weight:bold">white bold on blue</span></p>
<p><span style="background-color:red; color:white; font-weight:bold; font-style:italic; text-decoration:underline">styled on red</span></p>
<span style="background-color:#abc; color:black">short abc background</span><br>
<span style="background-color:not-a-color">invalid background ignored</span><br>

<p>END PHASE2B BACKGROUNDS</p>
</body>
</html>
